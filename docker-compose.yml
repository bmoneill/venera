services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ephemeris_data:/app/data
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ephemeris_data:
